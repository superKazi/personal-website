    <style>
      @font-face {
        font-family: "Degular";
        src: url("/DegularVariable.woff2") format("woff2-variations");
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: dark;
        background-color: #100f0f;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .sound {
        position: fixed;
        inset-block-end: max(1rem, env(safe-area-inset-bottom));
        inset-inline-end: max(1rem, env(safe-area-inset-right));
        inline-size: 2.75rem;
        block-size: 2.75rem;
        padding: 0.625rem;
        border: 0;
        border-radius: 0.5rem;
        background: none;
        cursor: pointer;
        /* revealed by script once the intro ends */
        visibility: hidden;
        opacity: 0;
      }

      .sound svg {
        /* clicks always land on the button, never on the animating bars */
        pointer-events: none;
        display: block;
        inline-size: 100%;
        block-size: 100%;
        overflow: visible;
      }

      .sound polygon {
        stroke: #100f0f;
        stroke-width: 0.5;
        stroke-linejoin: round;
      }

      .sound:focus-visible {
        outline: 1px solid #878580;
        outline-offset: 2px;
      }

      canvas {
        /* every touch on the piece is a Rustle, never a scroll or zoom */
        touch-action: none;
        position: fixed;
        inset: 0;
        inline-size: 100%;
        block-size: 100%;
        display: block;
      }
    </style>
