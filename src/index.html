    <style>
      @font-face {
        font-family: "Degular";
        src: url("/DegularVariable.woff2") format("woff2-variations");
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: dark;
        background-color: #100f0f;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        overflow: hidden;
        overscroll-behavior: none;
        font-family:
          Degular, Inter, Roboto, "Helvetica Neue", "Arial Nova", "Nimbus Sans",
          Arial, sans-serif;
        font-weight: normal;
      }

      h1 {
        position: fixed;
        inset: 40% 1rem auto;
        text-align: center;
        font: 700 2rem sans-serif;
        color: #cecdc3;
      }

      .ready h1,
      .rustle-keyboard:not(:focus-visible),
      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .rustle-keyboard {
        position: fixed;
        inset: 1rem auto auto 1rem;
        z-index: 1;
        padding: 0.75rem;
        color: #cecdc3;
        background: #100f0f;
      }

      body:not(.ready) .rustle-keyboard {
        display: none;
      }
      .rustle-keyboard:focus-visible {
        outline: 2px solid #cecdc3;
      }

      .sound {
        position: fixed;
        inset-block-end: max(1rem, env(safe-area-inset-bottom));
        inset-inline-end: max(1rem, env(safe-area-inset-right));
        inline-size: 2.75rem;
        block-size: 2.75rem;
        padding: 0.625rem;
        border: 0;
        border-radius: 0.5rem;
        background: none;
        cursor: pointer;
        /* revealed by script once the intro ends */
        visibility: hidden;
        opacity: 0;
      }

      .sound-status {
        position: fixed;
        inset-block-end: calc(max(1rem, env(safe-area-inset-bottom)) + 3.25rem);
        inset-inline-end: max(1rem, env(safe-area-inset-right));
        max-inline-size: min(20rem, calc(100% - 2rem));
        border-radius: 0.25rem;
        color: #cecdc3;
        background: #100f0f;
        font-size: 0.875rem;
        line-height: 1.4;
        font-weight: 500;
      }

      .sound-status:not(:empty) {
        padding: 0.5rem 0.75rem;
      }

      .sound svg {
        /* clicks always land on the button, never on the animating bars */
        pointer-events: none;
        display: block;
        inline-size: 100%;
        block-size: 100%;
        overflow: visible;
        translate: -2px -1px;
      }

      .byline {
        position: fixed;
        inset-block-end: max(1rem, env(safe-area-inset-bottom));
        inset-inline-start: max(1rem, env(safe-area-inset-left));
        /* centered on the Sound toggle's box so both corners share a line */
        font-size: 0.875rem;
        line-height: 1;
        font-weight: 500;
        color: #878580;
        translate: 0 -0.666rem;
      }

      .byline a {
        color: #cecdc3;
        text-decoration: none;
      }

      /* a tiny rising Stack: the link's cue instead of an underline */
      .byline svg {
        display: inline-block;
        block-size: 0.9em;
        margin-inline-start: 0.3em;
        vertical-align: -0.05em;
        overflow: visible;
      }

      .byline polygon {
        fill: #6f6e69;
        stroke: #100f0f;
        stroke-width: 0.3;
        stroke-linejoin: round;
      }

      /* hovered, the bars take Panel colors, like the Sound toggle turning on */
      .byline a:is(:hover, :focus-visible) polygon:nth-child(1) {
        fill: #92bfdb;
      }

      .byline a:is(:hover, :focus-visible) polygon:nth-child(2) {
        fill: #dfb431;
      }

      .byline a:is(:hover, :focus-visible) polygon:nth-child(3) {
        fill: #ffe7ce;
      }

      .byline a:focus-visible {
        outline: 1px solid #878580;
        outline-offset: 2px;
      }

      .sound polygon {
        stroke: #100f0f;
        stroke-width: 0.5;
        stroke-linejoin: round;
      }

      .sound:focus-visible {
        outline: 1px solid #878580;
        outline-offset: 2px;
      }

      .ready canvas {
        visibility: visible;
      }

      canvas {
        visibility: hidden;
        /* every touch on the piece is a Rustle, never a scroll or zoom */
        touch-action: none;
        position: fixed;
        inset: 0;
        inline-size: 100%;
        block-size: 100%;
        display: block;
      }
    </style>
