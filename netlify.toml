# REDIRECTS

[[redirects]]
  from = "https://kazielmanawal.netlify.com/*"
  to = "https://kazielmanawal.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kazielmanawal.netlify.com/*"
  to = "https://kazielmanawal.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://kazielmanawal.netlify.app/*"
  to = "https://kazielmanawal.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kazielmanawal.netlify.app/*"
  to = "https://kazielmanawal.me/:splat"
  status = 301
  force = true

# HEADERS	

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self' gc.zgo.at app.netlify.com netlify-cdp-loader.netlify.app; style-src 'self' 'unsafe-inline'; child-src 'self' app.netlify.com; connect-src 'self' superkazi.goatcounter.com; img-src 'self' superkazi.goatcounter.com;"

# Explicit even though it's Netlify's default, so the service worker always sees fresh copies
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate, public"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate, public"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate, public"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate, public"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate, public"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.png"
  [headers.values]
		Cache-Control = '''
			max-age=604800,
			public,
      stale-while-revalidate=86400'''

[[headers]]
  for = "/*.svg"
  [headers.values]
		Cache-Control = '''
			max-age=604800,
			public,
      stale-while-revalidate=86400'''

[[headers]]
